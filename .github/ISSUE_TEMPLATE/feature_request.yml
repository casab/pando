name: Idea
description: Something pando should do, or do differently.
labels: [idea]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What you were trying to do, and where pando got in the way or fell short.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: What you would like pando to do. Sketch the command, the key or the output if you can.
  - type: textarea
    id: alternatives
    attributes:
      label: What you do today instead
