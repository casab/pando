name: release-smoke

# Proves a published release installs the way the README says and runs.
#
# dist calls this after it announces a release (post-announce-jobs in
# Cargo.toml), because a release published with a workflow's GITHUB_TOKEN
# triggers no other workflow: `on: release` would never fire. It can also
# be run by hand for any tag. Each leg installs through the shell installer
# of *that* tag — never releases/latest, which skips pre-releases — checks
# the version, and runs pando on a generated fixture repository.
on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "The release tag to test, e.g. v0.5.1"
        required: true
        type: string

permissions:
  contents: read

jobs:
  smoke:
    name: install and run (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-latest, macos-15-intel, ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    env:
      PLAN: ${{ inputs.plan }}
      DISPATCH_TAG: ${{ inputs.tag }}
    steps:
      - name: Which release
        id: release
        shell: bash
        run: |
          if [ -n "$PLAN" ]; then
            tag=$(jq -r '.announcement_tag' <<<"$PLAN")
            prerelease=$(jq -r '.announcement_is_prerelease' <<<"$PLAN")
          else
            tag="$DISPATCH_TAG"
            prerelease=$([[ "$tag" == *-* ]] && echo true || echo false)
          fi
          {
            echo "tag=$tag"
            echo "version=${tag#v}"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
          echo "testing $tag (prerelease: $prerelease)"

      - name: Install with the release's shell installer
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            "https://github.com/${{ github.repository }}/releases/download/${{ steps.release.outputs.tag }}/pando-cli-installer.sh" | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: The installed pando is the release's
        shell: bash
        run: |
          set -x
          [ "$(command -v pando)" = "$HOME/.local/bin/pando" ]
          [ "$(pando --version)" = "pando ${{ steps.release.outputs.version }}" ]

      # The repository is made here, in a few lines of shell, rather than
      # by the test suite's fixture script: that one compiles pando's
      # source, which took most of eight minutes on the Intel runner. What
      # this proves is the installed binary, and a committed pando.toml
      # with one python listener is all it needs to start something.
      - name: Run pando on a fixture repository
        shell: bash
        env:
          GIT_AUTHOR_NAME: pando smoke
          GIT_AUTHOR_EMAIL: smoke@pando.invalid
          GIT_COMMITTER_NAME: pando smoke
          GIT_COMMITTER_EMAIL: smoke@pando.invalid
        run: |
          set -euo pipefail
          repo="$RUNNER_TEMP/smoke/repo"
          export PANDO_HOME="$RUNNER_TEMP/smoke/pando-home"
          mkdir -p "$repo"
          cd "$repo"
          git init -q -b main
          # A bare socket, not `http.server`: that one resolves its own
          # name between bind and listen, which outlasts the readiness wait
          # on the macOS runners.
          printf '%s\n' '[dev]' \
            "cmd = '''python3 -u -c \"import socket,time;s=socket.socket();s.setsockopt(socket.SOL_SOCKET,socket.SO_REUSEADDR,1);s.bind(('127.0.0.1',{port:web}));s.listen(5);print('listening');time.sleep(3600)\"'''" \
            'ports = ["web"]' > pando.toml
          echo "# smoke" > README.md
          git add .
          git commit -q -m fixture
          set -x
          pando doctor --json > /dev/null
          pando new smoke
          pando start smoke --wait
          pando status smoke --json
          pando stop smoke
          pando rm smoke

      - name: Install with Homebrew
        if: runner.os == 'macOS' && steps.release.outputs.prerelease == 'false'
        shell: bash
        run: |
          brew install mertkaradayi/tap/pando
          [ "$("$(brew --prefix)/bin/pando" --version)" = "pando ${{ steps.release.outputs.version }}" ]
