name: pages

# Publishes site/ to GitHub Pages: https://mertkaradayi.github.io/pando/
#
# Pages on the free plan serves public repositories only, so while this
# repository is private the deploy job is skipped rather than failed. Once
# it is public, turn Pages on once (Settings → Pages → Source: GitHub
# Actions) and every push that changes site/ publishes it.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy site/
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
