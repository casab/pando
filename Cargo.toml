[package]
name = "pando-cli"
version = "0.4.0"
edition = "2024"
description = "One repo. Every branch alive."

[lib]
name = "pando"
path = "src/lib.rs"

[[bin]]
name = "pando"
path = "src/main.rs"

[dependencies]
ansi-to-tui = "8"
anyhow = "1.0.102"
chrono = { version = "0.4.44", default-features = false, features = ["serde", "clock"] }
clap = { version = "4.6.1", features = ["derive"] }
clap_complete = "4.6.11"
crossterm = "0.29.0"
libc = "0.2.185"
md5 = "0.8.0"
nix = { version = "0.31.2", features = ["signal", "process"] }
notify = "8"
notify-debouncer-full = "0.5"
ratatui = "0.30.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
toml = "0.9.8"
toml_edit = "0.25.15"
unicode-width = "0.2"

[dev-dependencies]
serde_json = "1.0.149"
tempfile = "3.27.0"

# Dependencies are built optimised even in a dev build: the tests spend
# their CPU in ratatui's buffers and toml/serde parsing, not in pando's own
# code, and a dependency is compiled once, so pando's incremental builds
# stay as quick as they were.
[profile.dev.package."*"]
opt-level = 2
