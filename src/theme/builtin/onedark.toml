# One Dark and One Light, from Atom.
# From Ghostty's "Atom One Dark" and "Atom One Light" themes; every other colour
# pando uses is derived from these (see theme/palette.rs).

description = "One Dark and One Light, from Atom"

[dark]
background = "#282c34"
foreground = "#abb2bf"
red        = "#e06c75"
green      = "#98c379"
yellow     = "#e5c07b"
blue       = "#61afef"
magenta    = "#c678dd"
cyan       = "#56b6c2"
orange     = "#d19a66"

[light]
background = "#f9f9f9"
foreground = "#2a2c33"
red        = "#e45649"
green      = "#50a14f"
yellow     = "#c18401"
blue       = "#4078f2"
magenta    = "#a626a4"
cyan       = "#0184bc"
orange     = "#986801"
