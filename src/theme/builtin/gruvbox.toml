# Gruvbox: Dark and Light.
# From Ghostty's "Gruvbox Dark" and "Gruvbox Light" themes; every other colour
# pando uses is derived from these (see theme/palette.rs).

description = "Gruvbox: Dark and Light"

[dark]
background = "#282828"
foreground = "#ebdbb2"
red        = "#cc241d"
green      = "#98971a"
yellow     = "#d79921"
blue       = "#458588"
magenta    = "#b16286"
cyan       = "#689d6a"
orange     = "#fe8019"

[light]
background = "#fbf1c7"
foreground = "#3c3836"
red        = "#cc241d"
green      = "#98971a"
yellow     = "#d79921"
blue       = "#458588"
magenta    = "#b16286"
cyan       = "#689d6a"
orange     = "#af3a03"
