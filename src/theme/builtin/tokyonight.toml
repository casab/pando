# Tokyo Night: Night when dark, Day when light.
# From Ghostty's "TokyoNight Night" and "TokyoNight Day" themes; every other colour
# pando uses is derived from these (see theme/palette.rs).

description = "Tokyo Night: Night when dark, Day when light"

[dark]
background = "#1a1b26"
foreground = "#c0caf5"
red        = "#f7768e"
green      = "#9ece6a"
yellow     = "#e0af68"
blue       = "#7aa2f7"
magenta    = "#bb9af7"
cyan       = "#7dcfff"
orange     = "#ff9e64"

[light]
background = "#e1e2e7"
foreground = "#3760bf"
red        = "#f52a65"
green      = "#587539"
yellow     = "#8c6c3e"
blue       = "#2e7de9"
magenta    = "#9854f1"
cyan       = "#007197"
orange     = "#b15c00"
