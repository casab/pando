# GitHub: Dark and Light Colorblind.
# From Ghostty's "GitHub Dark Colorblind" and "GitHub Light Colorblind" themes; every other colour
# pando uses is derived from these (see theme/palette.rs).

description = "GitHub: Dark and Light Colorblind"

[dark]
background = "#0d1117"
foreground = "#c9d1d9"
red        = "#ec8e2c"
green      = "#58a6ff"
yellow     = "#d29922"
blue       = "#58a6ff"
magenta    = "#bc8cff"
cyan       = "#39c5cf"
orange     = "#ec8e2c"

[light]
background = "#ffffff"
foreground = "#24292f"
red        = "#b35900"
green      = "#0550ae"
yellow     = "#4d2d00"
blue       = "#0969da"
magenta    = "#8250df"
cyan       = "#1b7c83"
orange     = "#b35900"
